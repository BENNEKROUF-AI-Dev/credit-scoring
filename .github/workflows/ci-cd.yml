name: CI/CD — API de scoring

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------ 1. TESTS
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt
      - name: Tests unitaires et d'intégration
        env:
          ENABLE_UI: "0"
        run: pytest -v --cov=app --cov-report=term-missing --cov-fail-under=80

  # ------------------------------------------------------------------ 2. BUILD
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Nom de l'image en minuscules (exigé par Docker)
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/credit-scoring-api" >> "$GITHUB_ENV"
      - name: Construire l'image Docker
        run: docker build -t $IMAGE_NAME:${{ github.sha }} -t $IMAGE_NAME:latest .
      - name: Smoke test du conteneur
        run: |
          docker run -d --name api -p 7860:7860 $IMAGE_NAME:${{ github.sha }}
          for i in $(seq 1 30); do curl -fs http://localhost:7860/health && break; sleep 2; done
          # dossier minimal (client sans historique) puis dossier complet d'exemple
          curl -fs -X POST http://localhost:7860/predict -H "Content-Type: application/json" -d '{
            "AMT_INCOME_TOTAL": 180000, "AMT_CREDIT": 600000,
            "DAYS_BIRTH": -14000, "CODE_GENDER": "F"}'
          ID=$(curl -fs http://localhost:7860/clients | python3 -c "import sys,json; print(json.load(sys.stdin)[0])")
          curl -fs http://localhost:7860/clients/$ID | curl -fs -X POST http://localhost:7860/predict \
               -H "Content-Type: application/json" -d @-
          # une requête invalide doit renvoyer 422
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:7860/predict \
                 -H 'Content-Type: application/json' -d '{"AMT_CREDIT": "abc"}')" = "422"
          docker logs api
          docker rm -f api
      - name: Publier l'image sur GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest

  # ------------------------------------------------------------------ 3. DEPLOY
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}   # URL secrète fournie par Render
      RENDER_URL: ${{ vars.RENDER_URL }}                     # ex : https://credit-scoring-api.onrender.com
    steps:
      - name: Déclencher le déploiement sur Render
        if: env.RENDER_DEPLOY_HOOK != ''
        run: |
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK" > /dev/null
          echo "Déploiement déclenché sur Render (commit ${GITHUB_SHA::7})"
      - name: Vérifier que l'API en ligne répond
        if: env.RENDER_DEPLOY_HOOK != '' && env.RENDER_URL != ''
        run: |
          sleep 90   # laisse Render construire et démarrer la nouvelle version
          for i in $(seq 1 40); do
            if curl -fs "$RENDER_URL/health"; then echo; echo "API en ligne : $RENDER_URL/docs"; exit 0; fi
            sleep 15
          done
          echo "L'API ne répond pas après ~11 min" && exit 1
      - name: Pas de secret RENDER_DEPLOY_HOOK — déploiement ignoré
        if: env.RENDER_DEPLOY_HOOK == ''
        run: echo "Ajoutez le secret RENDER_DEPLOY_HOOK pour activer le déploiement."
