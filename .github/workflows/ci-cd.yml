name: CI/CD — API de scoring

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/credit-scoring-api

jobs:
  # ------------------------------------------------------------------ 1. TESTS
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt
      - name: Tests unitaires et d'intégration
        env:
          ENABLE_UI: "0"
        run: pytest -v --cov=app --cov-report=term-missing --cov-fail-under=80

  # ------------------------------------------------------------------ 2. BUILD
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'image Docker
        run: docker build -t $IMAGE_NAME:${{ github.sha }} -t $IMAGE_NAME:latest .
      - name: Smoke test du conteneur
        run: |
          docker run -d --name api -p 7860:7860 $IMAGE_NAME:${{ github.sha }}
          for i in $(seq 1 30); do curl -fs http://localhost:7860/health && break; sleep 2; done
          # dossier minimal (client sans historique) puis dossier complet d'exemple
          curl -fs -X POST http://localhost:7860/predict -H "Content-Type: application/json" -d '{
            "AMT_INCOME_TOTAL": 180000, "AMT_CREDIT": 600000,
            "DAYS_BIRTH": -14000, "CODE_GENDER": "F"}'
          ID=$(curl -fs http://localhost:7860/clients | python3 -c "import sys,json; print(json.load(sys.stdin)[0])")
          curl -fs http://localhost:7860/clients/$ID | curl -fs -X POST http://localhost:7860/predict \
               -H "Content-Type: application/json" -d @-
          # une requête invalide doit renvoyer 422
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:7860/predict \
                 -H 'Content-Type: application/json' -d '{"AMT_CREDIT": "abc"}')" = "422"
          docker logs api
          docker rm -f api
      - name: Publier l'image sur GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest

  # ------------------------------------------------------------------ 3. DEPLOY
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE }}   # ex : mon-pseudo/credit-scoring-api
    steps:
      - uses: actions/checkout@v4
      - name: Déployer sur Hugging Face Spaces (Docker)
        if: env.HF_TOKEN != '' && env.HF_SPACE != ''
        run: |
          pip install huggingface_hub
          python scripts/deploy_hf_space.py
      - name: Pas de secret HF_TOKEN — déploiement ignoré
        if: env.HF_TOKEN == '' || env.HF_SPACE == ''
        run: echo "Configurez le secret HF_TOKEN et la variable HF_SPACE pour activer le déploiement."
